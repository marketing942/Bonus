  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPPEM Concursos — Receba o seu bônus</title>
  <meta name="description" content="Cadastre-se e receba o seu bônus exclusivo do CPPEM Concursos." />
  <meta property="og:title" content="CPPEM Concursos — Receba o seu bônus" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

  <div class="bg-scrim" aria-hidden="true"></div>

  <main class="page hero">
    <img class="logo" src="public/logo-cppem.png" width="700" height="239" alt="CPPEM Concursos Públicos" />

    <h1 class="headline">
      Receba o seu <span class="hl">bônus</span> exclusivo.
    </h1>
    <p class="sub">
      Preencha os dados abaixo para liberar o seu acesso.
    </p>

    <!-- Os identificadores abaixo NÃO são decorativos — são o que o painel da
         PixelX usa para reconhecer o formulário e disparar a conversão
         (ver TRACKING.md do Contato-CPPEM, seção 6):
           · name="lead_form" e id="IPEyzyfmJhKQEYIXAlZH" no <form>
           · id/name lead_name/name, lead_email/email, lead_phone/phone
           · classe pxa_mask_phone no telefone
           · id="lead_submit" no botão
         Alterar qualquer um exige desligar a regra correspondente no painel. -->
    <form class="form" name="lead_form" id="IPEyzyfmJhKQEYIXAlZH" novalidate>
      <div class="field">
        <input type="text" id="lead_name" name="name" autocomplete="name" aria-label="Nome completo" placeholder="Nome completo" required />
        <span class="error" data-error-for="name"></span>
      </div>
      <div class="field">
        <input type="email" id="lead_email" name="email" autocomplete="email" aria-label="E-mail" placeholder="E-mail" required />
        <span class="error" data-error-for="email"></span>
      </div>
      <div class="field">
        <input class="pxa_mask_phone" type="text" id="lead_phone" name="phone" autocomplete="tel" aria-label="WhatsApp com DDD" placeholder="Seu WhatsApp com DDD — ex: (00) 00000-0000" required />
        <span class="error" data-error-for="phone"></span>
      </div>

      <button type="submit" id="lead_submit" class="cta">QUERO MEU BÔNUS</button>
      <p class="note">Cadastro gratuito. Seus dados estão seguros.</p>
      <p class="success" id="form-success" role="status" hidden>
        ✅ Cadastro recebido!<br />
        Parabéns! Já te enviei o material no instagram.
      </p>
    </form>
  </main>

  <script src="script.js"></script>
